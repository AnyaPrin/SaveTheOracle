<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パネル開閉サンプル</title>
    <style>
        /* CSS */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #0056b3;
        }

        .panel {
            position: fixed;
            top: 0;
            right: -300px; /* 初期状態で画面外 */
            width: 300px;
            height: 100%;
            background-color: #fff;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.3);
            transition: right 0.3s ease-in-out;
            padding: 20px;
            box-sizing: border-box;
        }

        .panel.open {
            right: 0; /* パネルが表示される位置 */
        }

        .panel-content {
            margin-top: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            position: absolute;
            top: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <!-- HTML -->
    <div id="solver">
        <div id="close-solver"></div>
        <div class="tab" id="solver-tab" onclick="togglePanel()">SOLVER</div>
        <div class="tab" onclick="togglePanel()">パネルを開く</div>
        <div class="panel" id="panel">
            <button class="close-btn" oonclick="togglePanel()">×</button>
            <div class="panel-content">
                <h2>パネル</h2>
                <p>ここにパネルの内容を記述します。</p>
            </div>
        </div>
    </div>
    <!-- JavaScript -->
    <script>
        function togglePanel() {
            const panel = document.getElementById('panel');
            panel.classList.toggle('open');
        }
    </script>
</body>
</html>
